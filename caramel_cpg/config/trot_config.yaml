hopf_cpg_node:
  ros__parameters:
    step_amplitude_x: 0.04       # tamanho do passo (m)
    lift_amplitude_z: 0.03       # altura de elevação (m)
    body_height: 0.0             # offset vertical
    omega: 6.283185              # frequência natural = 1 Hz (2π rad/s)
    mu: 10.0                     # taxa de convergência
    r_desired: 1.0               # amplitude interna alvo
    coupling_K: 6.0              # força de acoplamento
    dt: 0.02                     # passo de integração (s)
    # Fases para trote: FR=0, FL=π, BR=π, BL=0
    phase_desired: [0.0, 3.14159, 3.14159, 0.0]
